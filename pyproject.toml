# pyproject.toml — DiaryKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed. See FLEET_STANDARDS.md.
#
# Quick install (pip)
# -------------------
#   pip install -e "."                  core runtime (includes doc-kg / DocKG)
#   pip install -e ".[viz]"             + Streamlit/Plotly/PyVis visualizer
#   pip install -e ".[viz3d]"           + 3D visualization (pyvista, etc.)
#   pip install -e ".[viz,viz3d]"       + both visualizers
#
# Quick install (poetry)
# ----------------------
#   poetry install                      core runtime only
#   poetry install --with dev           + pytest, ruff, ty, pre-commit, pdoc
#   poetry install --extras "viz"       + Streamlit/Plotly visualizer only
#   poetry install --extras "viz3d"     + 3D visualization only
#   poetry install --all-extras --with dev      full maintainer environment
#
# First-time setup
# ----------------
#   poetry install --with dev
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=diary_kg           with coverage
#
# Build KG indices (after code changes)
# --------------------------------------
#   diarykg build --source pepys/pepys_enriched_full.txt
#   dockg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "diary_kg", from = "src" },
    { include = "diary_transformer", from = "src" },
]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "diary-kg"
version = "0.96.0"
description = "A knowledge graph builder and semantic search engine for diaries and journals"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "diary", "journal", "sqlite-vec", "sqlite", "semantic-search", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # Floor is 0.20.0: that release promotes `sqlite-vec` to a core doc-kg
    # dependency (so the old `[sqlite-vec]` extra is now a no-op) and moves
    # `lancedb` behind an extra we do not request, keeping it out of the tree.
    "doc-kg>=0.21.2",
    "kgmodule-utils>=0.12.1",
    # Upper-bounded: mcp 2.0 removed the bundled `mcp.server.fastmcp` module
    # (FastMCP was split out into the standalone `fastmcp` package) and rebuilt
    # mcp.server around new submodules. src/diary_kg/mcp_server.py imports
    # FastMCP from mcp, so an unbounded floor lets a clean install pull 2.x and
    # break `diarykg-mcp` at import time. Lift this only alongside a port to
    # the standalone fastmcp package.
    "mcp>=1.0.0,<2",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "rich>=14.3.3,<15",
    "sentence-transformers>=5.4.1",
    "spacy>=3.8.11,<4",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.14.0",
    "pyvis>=0.3.2",
    "streamlit>=1.35.0",
]
viz3d = [
    "markdown>=3.6",
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    "pyvista>=0.44.0",
    "pyvistaqt>=0.11.0",
    "trame-vtk>=2.0.0",
]
# Cross-KG sibling integrations (pycode-kg, doc-kg, ftree-kg, agent-kg) are
# OPTIONAL and installed manually — they are never imported by diary_kg's code.
# The only consumer is the git hook generated by `diarykg install-hooks`, which
# shells out to `.venv/bin/pycodekg`, so it resolves at the venv rather than
# through this package's dependency graph.
#
# Declaring them here made poetry's universal resolution reconcile their
# transformers pins with this project's on every lock — the deadlock doc_kg hit
# when it and pycode-kg each declared the other (poetry locks optional groups
# too, so an extra is not free). memory_kg and doc_kg both dropped their sibling
# extras for this reason; this follows them.
#   pip install pycode-kg                 # PyPI
#   pip install 'ftree-kg @ git+https://github.com/Flux-Frontiers/ftree_kg.git'
#   pip install 'agent-kg @ git+https://github.com/Flux-Frontiers/agent_kg.git'

# An `all` aggregate extra used to sit here. It re-listed every dev tool by
# name, so the wheel advertised them as installable regardless of where the dev
# dependencies themselves lived — the defect that survived doc_kg's and
# Metabo_kg's group migrations. Retired: ask for the feature extras you want.

# Repo tooling, not a user-facing feature — `poetry install --with dev`.
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
ty = ">=0.0.44"
pdoc = ">=14.0.0"
pillow = ">=10.0.0"
pre-commit = ">=4.5.1"
pylint = ">=4.0.5"
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0,<0.16"
vtracer = ">=0.6.15"

[project.urls]
Homepage  = "https://github.com/Flux-Frontiers/diary_kg"
Repository = "https://github.com/Flux-Frontiers/diary_kg"

[project.scripts]
diarykg           = "diary_kg.cli:main"
diarykg-mcp       = "diary_kg.mcp_server:main"
diary-transformer = "diary_transformer.cli:main"
diary-embedder    = "diary_transformer.diary_embedder:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff 0.16 formats Python code blocks inside Markdown as stable behaviour
# (0.15 gates it behind preview), so `ruff format --check .` starts rewriting
# prose docs the moment the lock resolves 0.16 — a failure that looks unrelated
# to whatever change triggered the relock. Doc snippets are illustrative and
# often deliberately aligned, so keep them out of the formatter's reach.
# doc_kg and ftree_kg carry the same exclusion.
exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]
markers = [
    "integration: requires external models or services (skipped in CI)",
]
filterwarnings = [
    "ignore::sklearn.exceptions.ConvergenceWarning",
]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "broad-exception-caught",   # W0718
    "cell-var-from-loop",       # W0640
    "cyclic-import",            # R0401
    "import-outside-toplevel",  # C0415
    "undefined-variable",       # E0602
]

# ---------------------------------------------------------------------------
# PyCodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
exclude = ["tests"]
include = ["src"]

[tool.diarykg]
include = ["diary"]

[tool.dockg]
exclude = ["src", "bundles", "dist", "pepys", "diary"]

# ---------------------------------------------------------------------------
# Poe tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks.docs]
help     = "Generate project documentation"
sequence = [
    { shell = "cd src && pdoc --o ../docs --logo ./logo.png diary_kg diary_transformer" },
]

[tool.poe.tasks.wiki]
help = "Generate and publish GitHub wiki from docs/"
cmd  = "python scripts/generate_wiki.py"

[tool.poe.tasks.wiki-preview]
help = "Preview wiki generation without publishing"
cmd  = "python scripts/generate_wiki.py --dry-run"
